name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        run: |
          curl -kfsS --max-time 15 https://118.31.111.223:8080/healthz
          curl -kfsS --max-time 15 https://118.31.111.223:8080/readyz
