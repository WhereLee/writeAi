name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum
      - name: Create database and user
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE llm_gateway CHARACTER SET utf8mb4; CREATE USER IF NOT EXISTS gateway@'%' IDENTIFIED BY 'gateway123'; GRANT ALL ON llm_gateway.* TO gateway@'%'; FLUSH PRIVILEGES;"
      - name: Run tests
        working-directory: backend
        env:
          TEST_MYSQL_DSN: "gateway:gateway123@tcp(127.0.0.1:3306)/llm_gateway?parseTime=true&charset=utf8mb4"
          REQUIRE_TEST_DB: "true"
        run: go test ./... -v -count=1 -p 1

  race:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum
      - name: Create database and user
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE llm_gateway CHARACTER SET utf8mb4; CREATE USER IF NOT EXISTS gateway@'%' IDENTIFIED BY 'gateway123'; GRANT ALL ON llm_gateway.* TO gateway@'%'; FLUSH PRIVILEGES;"
      - name: Run race tests
        working-directory: backend
        env:
          TEST_MYSQL_DSN: "gateway:gateway123@tcp(127.0.0.1:3306)/llm_gateway?parseTime=true&charset=utf8mb4"
          REQUIRE_TEST_DB: "true"
        run: go test -race ./... -count=1 -p 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: |
          go build ./...
          go vet ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        working-directory: backend
        run: docker build -t llm-api-gateway:latest .


