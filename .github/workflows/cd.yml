name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/wherelee/llm-api-gateway:latest
            ghcr.io/wherelee/llm-api-gateway:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'http://118.31.111.223:8080' }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: frontend/dist
          target: /opt
          strip_components: 1
          overwrite: true
          timeout: 60s

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: deploy/docker-compose.server.yml
          target: /opt/llm-gateway
          strip_components: 1
          overwrite: true
          timeout: 60s

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 60s
          script: |
            set -eu
            cd /opt/llm-gateway

            IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
            export IMAGE_TAG
            compose="docker compose -f docker-compose.server.yml"
            prev=$(cat DEPLOYED_SHA 2>/dev/null || true)

            $compose pull server
            if systemctl is-active --quiet llm-server; then
              systemctl disable --now llm-server
            fi

            if ! $compose up -d server; then
              echo "docker compose up failed"
              $compose logs --tail=50 server || true
              $compose down || true
              systemctl enable --now llm-server || true
              exit 1
            fi

            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done

            if [ "$ok" != "1" ]; then
              echo "health check failed"
              $compose logs --tail=50 server || true
              if [ -n "$prev" ]; then
                echo "rolling back to $prev"
                export IMAGE_TAG="$prev"
                $compose up -d server
              else
                $compose down || true
                systemctl enable --now llm-server || true
              fi
              exit 1
            fi

            echo "$IMAGE_TAG" > DEPLOYED_SHA
            $compose ps
            echo "deployed $IMAGE_TAG"
