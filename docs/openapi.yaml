openapi: 3.0.3
info:
  title: LLM API Gateway
  version: 0.1.0
  description: Token-billed LLM API gateway.
servers:
  - url: https://118.31.111.223:8080
    description: Self-signed HTTPS entrypoint

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        invite_code:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    APIKey:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        key_prefix:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        expires_at:
          type: string
          nullable: true
        last_used_at:
          type: string
          nullable: true
        created_at:
          type: string
    CreditChangeRequest:
      type: object
      required: [user_id, credits, reason]
      properties:
        user_id:
          type: integer
        credits:
          type: number
          description: Positive number of credits; the server converts it to integer tokens.
        reason:
          type: string
          maxLength: 255
    CreditOperation:
      type: object
      properties:
        id: {type: integer}
        op_no: {type: string}
        user_id: {type: integer}
        kind: {type: string, enum: [GRANT, REVOKE]}
        delta_tokens: {type: integer}
        balance_before: {type: integer}
        balance_after: {type: integer}
        reason: {type: string}
        operator_id: {type: integer}
        client_request_id: {type: string}
        created_at: {type: string}
    BalanceLog:
      type: object
      properties:
        id: {type: integer}
        user_id: {type: integer}
        type: {type: string}
        amount: {type: integer}
        balance_after: {type: integer}
        usage_log_id: {type: integer, nullable: true}
        reference_type: {type: string, nullable: true}
        reference_id: {type: integer, nullable: true}
        operator_id: {type: integer, nullable: true}
        reason: {type: string, nullable: true}
        created_at: {type: string}
    UsageLog:
      type: object
      properties:
        id: {type: integer}
        model: {type: string}
        prompt_tokens: {type: integer}
        output_tokens: {type: integer}
        total_tokens: {type: integer}
        latency_ms: {type: integer}
        status_code: {type: integer}
        created_at: {type: string}
    AdminUser:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        role: {type: string}
        tokens: {type: integer}
        credits: {type: string}
        created_at: {type: string}
    AuditLog:
      type: object
      properties:
        id: {type: integer}
        actor_id: {type: integer}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: integer}
        request_id: {type: string, nullable: true}
        ip: {type: string, nullable: true}
        detail: {type: object, nullable: true}
        created_at: {type: string}
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        stream:
          type: boolean
          default: false
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
              content:
                type: string
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

paths:
  /api/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
        '403':
          description: Invalid invite code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
  /api/login:
    post:
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests
  /api/me:
    get:
      summary: Get current user, role, and balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile and balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: {type: integer}
                  username: {type: string}
                  role: {type: string, enum: [user, admin]}
                  tokens: {type: integer}
                  credits: {type: string}
                  tokens_per_credit: {type: integer}
        '401':
          description: Unauthorized
  /api/models:
    get:
      summary: List configured models
      responses:
        '200':
          description: Model names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/balance:
    get:
      summary: Get current balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  balance:
                    type: integer
        '401':
          description: Unauthorized
  /api/keys:
    get:
      summary: List API keys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Keys, without the full secret
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
    post:
      summary: Create an API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                expires_in_days:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Created; the full key is returned only once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  key:
                    type: string
                  key_prefix:
                    type: string
                  name:
                    type: string
  /api/keys/{id}:
    delete:
      summary: Disable an API key
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Disabled
        '404':
          description: Key not found for this user
  /api/credits/ledger:
    get:
      summary: List current user's balance ledger
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceLog'
  /api/usage:
    get:
      summary: List current user's usage
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Usage entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageLog'
  /api/admin/credits/grant:
    post:
      summary: Grant credits to a user
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditChangeRequest'
      responses:
        '200':
          description: Applied, or the original operation for a repeated idempotency key
        '400':
          description: Invalid amount, reason, or per-operation limit exceeded
        '403':
          description: Admin role required
        '404':
          description: User not found
  /api/admin/credits/revoke:
    post:
      summary: Revoke credits from a user
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditChangeRequest'
      responses:
        '200':
          description: Applied, or the original operation for a repeated idempotency key
        '409':
          description: Balance would become negative
  /api/admin/credits/operations:
    get:
      summary: List credit operations
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema: {type: integer}
        - name: operator_id
          in: query
          schema: {type: integer}
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Operations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditOperation'
  /api/admin/users:
    get:
      summary: List or search users
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Users with balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
  /api/admin/audit-logs:
    get:
      summary: List admin audit logs
      security:
        - BearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema: {type: integer}
        - name: action
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Audit logs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
  /v1/chat/completions:
    post:
      summary: Chat completion proxy
      description: Set stream=true for Server-Sent Events.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: JSON response, or text/event-stream when stream=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                type: string
        '401':
          description: Invalid API key
        '402':
          description: Insufficient balance
        '429':
          description: Rate limited
        '502':
          description: Upstream error
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: ok
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: ready
        '503':
          description: MySQL or Redis not ready
